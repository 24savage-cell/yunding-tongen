<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>云顶道庭·彤恩卷</title>
<!-- v5.2 移动调试：默认禁用；调试时 URL 加 ?eruda=1 即可启用控制台（Console/网络/报错栈） -->
<script>
(function(){
  try{
    var l=window.location;
    if(l.search.indexOf('eruda=1')<0 && l.hash.indexOf('eruda')<0) return;
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/eruda@3.0.1/eruda.min.js';
    s.onload=function(){ if(window.eruda) eruda.init(); };
    s.onerror=function(){ console.warn('eruda 加载失败（需联网）'); };
    document.head.appendChild(s);
  }catch(e){}
})();
</script>
<!-- Supabase JS SDK（CDN，部署后自动加载；未配置时游戏自动降级为本地双人演示模式） -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.1/dist/umd/supabase.min.js"></script>
<meta name="theme-color" content="#0a1418">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href='data:application/manifest+json,{"name":"云顶道庭·彤恩卷","short_name":"云顶道庭","display":"standalone","background_color":"%230a1418","theme_color":"%230a1418","start_url":"."}'>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bootScreen" style="position:fixed;inset:0;z-index:9999;transition:opacity .4s;background:radial-gradient(140% 90% at 50% -10%,rgba(63,125,92,.3) 0%,transparent 55%),linear-gradient(175deg,#0e1f26 0%,#0a1418 70%);display:flex;flex-direction:column;align-items:center;justify-content:center">
  <div style="font-family:'STKaiti','KaiTi','STSong',serif;color:#d8b45a;font-size:26px;letter-spacing:8px;text-shadow:0 0 18px rgba(216,180,90,.35);margin-bottom:18px">云顶道庭 · 彤恩卷</div>
  <div style="width:180px;height:3px;background:rgba(216,180,90,.18);border-radius:2px;overflow:hidden"><div id="bootBar" style="width:8%;height:100%;background:linear-gradient(90deg,#a8842a,#f4e3a8);border-radius:2px;transition:width .3s"></div></div>
  <div id="bootTxt" style="color:#8fa39a;font-size:11px;margin-top:10px;letter-spacing:2px">正在连接仙界…</div>
</div>
<canvas id="fxCanvas"></canvas>
<canvas id="introCanvas" style="display:none"></canvas>
<div id="app" style="display:none">
  <header id="topbar"></header>
  <div id="connBar">正在连接仙界…</div>
  <nav id="tabs"></nav>
  <main id="content"></main>
  <footer id="bottombar"></footer>
</div>
<div id="loginView"><canvas id="loginCanvas"></canvas><div class="login-box" id="loginBox"></div></div>
<div id="modal-root"><div class="mask" data-act="closeModal"></div><div class="modal" id="modal-box"></div></div>
<div id="toast"></div>
<div class="watermark" id="watermark"></div>
<script src="js/game.js"></script>
</body>
</html>
